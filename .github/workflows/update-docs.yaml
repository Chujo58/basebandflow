name: Auto-Update CLI Documentation

on:
  push:
    branches:
      - main
    # Only run if python CLI files or the readme itself change
    paths:
      - 'basebandflow/cli/**'
      - 'README.md'
      - 'pyproject.toml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write  

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install Dependencies & Typer CLI
        run: |
          python -m pip install --upgrade pip
          pip install "typer[cli]"
          pip install -e . # Installs basebandflow to resolve local imports

      - name: Generate CLI Reference File
        run: |
          typer basebandflow/cli/main.py utils docs --name bbflow --output CLI_REFERENCE.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # Only stage and commit if CLI_REFERENCE.md actually changed
          git add CLI_REFERENCE.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: auto-update CLI reference documentation [skip ci]"
            git push
          else
            echo "No documentation changes detected."
          fi